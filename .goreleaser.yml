version: 2

builds:
  - id: igit
    main: ./cmd/igit
    binary: igit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.revision={{.Tag}}-{{.ShortCommit}}-{{ trimsuffix (replace (replace .CommitDate "-" "") ":" "") "Z" }}

archives:
  - id: igit
    ids:
      - igit
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE

homebrew_casks:
  - repository:
      owner: YouSysAdmin
      name: homebrew-apps
    directory: Casks
    homepage: https://github.com/yousysadmin/igit
    description: Review and GIT tools
    license: MIT
    # goreleaser still emits Homebrew's deprecated postflight stanza from
    # hooks, so the steps form is written by hand until v2.19 ships the fix.
    # paths in a cask steps block are relative to the staged path.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "igit"], chdir: "."
        end
      end
